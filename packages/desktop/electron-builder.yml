# 桌面版打包配置（electron-builder）。
#
# 打包源 = `pnpm deploy --legacy` 产物（`.deploy/app`，自包含的扁平部署目录）——见
# `docs/design/50-desktop.md` §5：pnpm 的符号链接树会让打包器漏收 workspace 依赖，
# 因此依赖收集交给 pnpm deploy，electron-builder 只负责 asar + 安装包。
appId: com.whispering233.ai-editor
productName: AI Editor

directories:
  app: .deploy/app
  output: release

# 只打运行所需：dist（主进程 + preload）+ node_modules；排除源码与 tsconfig
files:
  - "**/*"
  - "!src/**"
  - "!tsconfig.json"
  - "!**/*.map"

# 原生模块不能在 asar 内 load
asarUnpack:
  - "**/*.node"

# better-sqlite3 v13 是 N-API 预编译模块，不需要针对 Electron 重编译
npmRebuild: false

# 自动更新元数据的来源（见 50-desktop.md §5.2）：本段负责产出
# ① 包内 resources/app-update.yml（更新器读它定位更新源）
# ② Release 资产 latest.yml（旧版靠它得知有新版本）
# 上传不在这里做——CI 用 softprops/action-gh-release；`pack.mjs` 传 `--publish never`。
publish:
  provider: github
  owner: whispering233
  repo: ai-editor

linux:
  target:
    - AppImage
  category: Office
  # 应用目录 package.json 的 name 含 scope（@whispering233/...）——executableName 会推导出含 `@`
  # 的名字，AppImage 工具链拒收（仅允许字母/数字/`-`/`_`/`.`/空格），必须显式指定
  executableName: ai-editor
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # 首版不签名/不公证（无 Apple Developer 证书）：identity 置 null，避免 CI 尝试签名而失败。
  # 代价：macOS 首次打开需右键 → 打开（见 README）。触发条件见 backlog。
  identity: null
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  target:
    - nsis
  # 同 linux：executableName 会从含 scope 的包名推导出非法文件名（`@`），必须显式指定
  executableName: ai-editor
  # 首版不签名（无代码签名证书）：Windows 会提示 SmartScreen，README 写明。
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  # 非一键安装：让用户能选安装目录（默认的 oneClick 静默装到用户目录，不好排查）
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 自定义卸载脚本（卸载前问「是否同时清除使用数据」，默认否）。
  # ⚠ 路径**相对 buildResources 目录**（默认 `<projectDir>/build`）解析——不是相对 projectDir：
  # `app-builder-lib` 的 `getResource()` 先查 build 目录下的文件清单，再
  # `path.resolve(buildResourcesDir, custom)`；写成 `build/installer.nsh` 会被解析成
  # `build/build/installer.nsh` 而直接报错（除非另设 `directories.buildResources`）。
  include: installer.nsh
