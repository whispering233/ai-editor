# 桌面版打包工作流：push 版本 tag（v*）时出 **Windows 安装包**并挂到该 tag 的 GitHub Release。
#
# 平台范围（2026-10 定）：只跑 windows-latest。本地开发机（Linux/WSL）只出 Linux 包做测试——
# electron-builder 交叉构建 Windows 目标需 Wine（官方口径），本仓不往开发机装该依赖；
# macOS 同理需 mac runner。matrix 里两个平台项已注释保留，有真实用户需求再恢复。
#
# 与 publish.yml（npm 发 5 包）同触发；两者互不阻塞：npm 包与桌面安装包共用同一个 tag 与版本号
# （版本号由 scripts/sync-version.mjs 统一抬，含 desktop 包）。
#
# 依赖收集 = `pnpm deploy --prod`（自包含扁平部署目录）→ electron-builder 只做 asar + 安装包，
# 原因见 docs/design/50-desktop.md §5（pnpm 符号链接树会让打包器漏收 workspace 包）。
#
# 首版**不签名**：macOS 无 Apple 证书（需右键打开）、Windows 有 SmartScreen 提示——README 写明；
# 也因此**不做自动更新**（electron-updater 在 macOS 要求已签名）。触发条件见 backlog。
name: Desktop

on:
  push:
    tags:
      - "v*"
  # 手动补包入口（不规范地重推 tag 会把 tag 指向变掉的 commit）：指定要挂资产的 Release tag，
  # 从当前 ref 构建三平台产物。用途：某个平台打包在 tag 运行时失败（如 v0.0.40 的 Windows
  # `spawnSync pnpm ENOENT`），修复后用本入口补产并挂到同一 Release（同名资产会被覆盖）。
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要挂资产的 Release tag（如 v0.0.40）"
        required: true

permissions:
  contents: write # 上传安装包到该 tag 的 Release

jobs:
  package:
    strategy:
      fail-fast: false # 多平台并发时一个挂了不代表其余平台结论无效（当前仅 Windows）
      matrix:
        include:
          # 当前只出 **Windows 包**（2026-10 定）：macOS/Linux 暂无真实用户需求，需要时取消下面注释即可恢复。
          # 本地开发机的 Windows 交叉构建需 Wine（electron-builder 官方口径），本仓以 CI 的 windows-latest 为唯一出包路径。
          - os: windows-latest
            args: --win nsis
            # 三资产（自动更新必需，见 50-desktop.md §5.2 / build.md）：`.exe` + `latest.yml` + `.exe.blockmap`。
            # 必须是**带目录前缀的完整路径**：多行值插进 `${{ matrix.files }}` 时只有第一行拿到属主
            # 拼上的前缀，其余行会落到仓库根下（Release 步骤的 `fail_on_unmatched_files: true` 会直接红）。
            files: |
              packages/desktop/release/*.exe
              packages/desktop/release/latest.yml
              packages/desktop/release/*.blockmap
          # - os: ubuntu-latest
          #   args: --linux AppImage
          #   files: "packages/desktop/release/*.AppImage"
          # - os: macos-latest
          #   args: --mac dmg --arm64 --x64
          #   files: "packages/desktop/release/*.dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40 # 首次会下载 electron 二进制 + 原生打包工具链
    steps:
      - uses: actions/checkout@v6
      # pnpm 版本读 package.json 的 packageManager（不写 version——单一事实源）
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 全仓构建：desktop 的 main/preload 与五个 workspace 包的 dist 都在这一步产出
      - run: pnpm -r build
      # 打包（deploy + electron-builder；平台参数由矩阵给出）
      - run: node packages/desktop/scripts/pack.mjs ${{ matrix.args }}
      - uses: softprops/action-gh-release@v2
        with:
          # push tag 时用 tag 名；手动触发时用输入（补包到已有 Release）
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: ${{ matrix.files }}
          # Release 通常已由 release.yml 从 CHANGELOG 建好；此处只挂资产（不存在时才创建）
          fail_on_unmatched_files: true
      # 同时传一份 CI artifact：手动触发时可直接下载到本地测试
      #（`gh run download <run-id> -n desktop-windows-latest`），不必先碰 Release。
      # `if: always()`：即使上面的 Release 上传失败也保留产物供排查。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: warn
