packages:
  - "packages/*"

# pnpm 11+ 构建批准：仅允许 better-sqlite3 执行 postinstall 编译脚本（N-API 原生模块）
# 注：pnpm 11.x 已用 allowBuilds（包名→布尔）取代 pnpm 10 的 onlyBuiltDependencies，
# 后者会被 pnpm 自动迁移为哨兵值 "set this to true or false" 导致构建被忽略。
allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
